
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>曾瀅蓁</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: "Microsoft JhengHei", sans-serif;
      background: #fff9ed;
    }

    .name-card {
      position: relative;
      padding: 65px 35px;
      text-align: center;
      border-radius: 40px;
      background: white;
      box-shadow: 0 15px 35px #ff9acb55;
      border: 5px solid white;
      animation: float 3s ease-in-out infinite;
    }

    h1 {
      margin: 0;
      font-size: clamp(48px, 10vw, 100px);
      font-weight: 900;
      letter-spacing: 8px;
      color: #ff4f91;
      text-shadow: 4px 5px 0 #ffd94d,
                   7px 8px 0 #8bdcff;
    }

    .name span:nth-child(2) {
      color: #ffbf28;
    }

    .name span:nth-child(3) {
      color: #35b9f5;
    }

    .star {
      position: absolute;
      font-size: 40px;
      animation: spin 5s linear infinite;
    }

    .star1 {
      top: 15px;
      left: 20px;
    }

    .star2 {
      right: 20px;
      bottom: 15px;
    }

    .heart {
      position: absolute;
      top: 20px;
      right: 35px;
      font-size: 35px;
    }

    .decoration {
      margin-top: 25px;
      font-size: 30px;
      letter-spacing: 12px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="name-card">
    <div class="star star1">⭐</div>
    <div class="heart">💗</div>
    <div class="star star2">✨</div>

    <h1 class="name">
      <span>曾</span><span>瀅</span><span>蓁</span>
    </h1>

    <div class="decoration">🌈 💛 🌸 💙</div>
  </div>
</body>
</html>
